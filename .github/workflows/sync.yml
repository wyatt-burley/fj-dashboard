name: Sync dashboard data

on:
  schedule:
    - cron: '17 2,8,14,20 * * *'   # every 6 hours (fast sync)
    - cron: '43 6 * * 1'           # Mondays: 12-month trend refresh
    - cron: '47 * * * *'           # hourly: FBM stock + POs from Finale (no Amazon calls)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        type: choice
        options: [fast, monthly, finale]
        default: fast

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Determine mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "43 6 * * 1") MODE=monthly ;;
              "47 * * * *") MODE=finale ;;
              *) MODE=fast ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
      - name: Run sync
        working-directory: sync
        env:
          LWA_CLIENT_ID: ${{ secrets.LWA_CLIENT_ID }}
          LWA_CLIENT_SECRET: ${{ secrets.LWA_CLIENT_SECRET }}
          LWA_REFRESH_TOKEN: ${{ secrets.LWA_REFRESH_TOKEN }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINALE_API_KEY: ${{ secrets.FINALE_API_KEY }}
          FINALE_API_SECRET: ${{ secrets.FINALE_API_SECRET }}
          FINALE_API_CONNECTION: ${{ secrets.FINALE_API_CONNECTION }}
          FINALE_ACCOUNT: funkyjunque
          MODE: ${{ steps.mode.outputs.mode }}
        run: python sync.py
